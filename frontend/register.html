<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HustleYouth - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="logo-brand">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="#8B5CF6"/></svg>
                <span>Hustle<span style="color:var(--text-main);">Youth</span></span>
            </a>
            <button id="close-sidebar" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <nav class="nav-links">
            <a href="index.html"><i class="fa-solid fa-compass"></i> Katalog Jasa</a>
            <a href="stream.html"><i class="fa-solid fa-comments"></i> Stream Chat</a>
            <a href="tambah-jasa.html"><i class="fa-solid fa-plus-circle"></i> Buka Jasa</a>
        </nav>
    </aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Main Content -->
    <main class="main-content">
        <header>
            <div class="header-left">
                <button id="open-sidebar" class="icon-btn" title="Menu Sidebar"><i class="fa-solid fa-bars"></i></button>
                <a href="index.html" class="logo-brand">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="#8B5CF6"/></svg>
                    <span>Hustle<span style="color:var(--text-main);">Youth</span></span>
                </a>
            </div>
            <div class="header-right">
                <button id="theme-toggle" class="icon-btn" title="Ubah Tema"><i class="fa-solid fa-sun"></i></button>
                <div id="nav-user-container"></div>
            </div>
        </header>

        <div class="container">
            <div class="auth-card">
                <div class="auth-header">
                    <h2>Buat Akun HustleYouth</h2>
                    <p style="color:var(--text-muted); font-size:0.9rem;">Daftar gratis buat mulai pasang iklan jasa atau cari talent.</p>
                </div>
                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Nama Lengkap</label>
                        <input type="text" id="reg_name" class="form-control" required placeholder="Ardi Aryo">
                    </div>
                    <div class="form-group">
                        <label>Asal Sekolah / Kampus</label>
                        <input type="text" id="reg_school" class="form-control" required placeholder="SMAN 1 Kepanjen">
                    </div>
                    <div class="form-group">
                        <label>Nomor WhatsApp</label>
                        <input type="tel" id="reg_whatsapp" class="form-control" required placeholder="08123456789">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="reg_email" class="form-control" required placeholder="ardi@gmail.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="reg_password" class="form-control" required minlength="6" placeholder="Minimal 6 karakter">
                    </div>
                    <button type="submit" class="btn-submit">Daftar Akun</button>
                    <p style="text-align:center; margin-top: 1.25rem; font-size:0.875rem; color:var(--text-muted);">
                        Sudah punya akun? <a href="login.html" style="color:var(--primary); font-weight:700;">Login</a>
                    </p>
                </form>
            </div>
        </div>
    </main>

    <script src="assets/js/auth.js"></script>
</body>
</html>
