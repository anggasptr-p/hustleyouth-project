<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HustleYouth - Buka Jasa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="logo-brand">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="#8B5CF6"/></svg>
                <span>Hustle<span style="color:var(--text-main);">Youth</span></span>
            </a>
            <button id="close-sidebar" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <nav class="nav-links">
            <a href="index.html"><i class="fa-solid fa-compass"></i> Katalog Jasa</a>
            <a href="stream.html"><i class="fa-solid fa-comments"></i> Stream Chat</a>
            <a href="tambah-jasa.html" class="active"><i class="fa-solid fa-plus-circle"></i> Buka Jasa</a>
        </nav>
    </aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Main Content -->
    <main class="main-content">
        <header>
            <div class="header-left">
                <button id="open-sidebar" class="icon-btn" title="Menu Sidebar"><i class="fa-solid fa-bars"></i></button>
                <a href="index.html" class="logo-brand">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="#8B5CF6"/></svg>
                    <span>Hustle<span style="color:var(--text-main);">Youth</span></span>
                </a>
            </div>
            <div class="header-right">
                <button id="theme-toggle" class="icon-btn" title="Ubah Tema"><i class="fa-solid fa-sun"></i></button>
                <div id="nav-user-container"></div>
            </div>
        </header>

        <div class="container">
            <div class="form-wrapper">
                <div class="form-header">
                    <h2>Tawarkan Keahlianmu</h2>
                    <p>Isi data di bawah ini untuk mulai mendapatkan klien.</p>
                </div>

                <form id="gig-form">
                    <div class="form-group">
                        <label for="title">Judul Jasa</label>
                        <input type="text" id="title" class="form-control" required placeholder="Contoh: Desain Logo Minimalis">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="category">Kategori</label>
                            <select id="category" class="form-control" required>
                                <option value="" disabled selected>Pilih Kategori</option>
                                <option value="Design">Design</option>
                                <option value="Video">Video</option>
                                <option value="Code">Code</option>
                                <option value="Writing">Writing</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="price">Harga (Rp)</label>
                            <input type="number" id="price" class="form-control" required min="10000" placeholder="Minimal 10000">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="freelancer_name">Nama Freelancer</label>
                            <input type="text" id="freelancer_name" class="form-control" required placeholder="Nama Lengkap">
                        </div>
                        <div class="form-group">
                            <label for="school">Asal Sekolah/Kampus</label>
                            <input type="text" id="school" class="form-control" required placeholder="Nama Instansi">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="whatsapp">Nomor WhatsApp</label>
                            <input type="tel" id="whatsapp" class="form-control" required placeholder="Contoh: 08123456789">
                        </div>
                        <div class="form-group">
                            <label for="image_file">Foto Portofolio (Opsional)</label>
                            <input type="file" id="image_file" accept="image/*" class="form-control">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description">Deskripsi Jasa</label>
                        <textarea id="description" class="form-control" required rows="4" placeholder="Jelaskan secara detail keahlian dan layanan yang kamu tawarkan..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-paper-plane"></i> Publikasikan Jasa
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/form.js"></script>
</body>
</html>
